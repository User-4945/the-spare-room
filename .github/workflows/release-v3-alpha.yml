name: Publish Beneath the House Alpha and promote v2.7.6
on:
  push:
    branches: [release-v3-alpha]
permissions:
  contents: write
concurrency:
  group: spare-room-v3-alpha
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
          - platform: mac
            runner: macos-15-intel
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare Alpha source and build revision
        run: node scripts/prepare-alpha.cjs '${{ matrix.platform }}'
      - name: Verify story, anomalies, saves and update channels
        run: |
          node tests/beneath.cjs
          node tests/alpha-dread.cjs
          node --test tests/updater.cjs tests/developer-updates.cjs tests/save-store.cjs tests/admin-auth.cjs tests/admin-network.cjs
      - name: Build native app
        run: |
          node scripts/prepare-desktop.cjs
          npx electron-builder --config platforms/electron-builder.cjs --${{ matrix.platform }} --publish never
      - name: Verify installed Windows app twice
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem platform-build/*Setup*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'spare-alpha-installed'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          $env:SPARE_ROOM_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'spare-alpha-profile'
          foreach ($attempt in 1,2) {
            $env:SPARE_ROOM_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP "alpha-smoke-$attempt.json"
            $argsList = @('--smoke-test')
            if ($attempt -eq 2) { $argsList += '--smoke-verify-save' }
            $p = Start-Process (Join-Path $installDir 'The Spare Room.exe') -ArgumentList $argsList -PassThru
            if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Installed app timed out' }
            $r = Get-Content $env:SPARE_ROOM_SMOKE_REPORT -Raw | ConvertFrom-Json
            if ($p.ExitCode -ne 0 -or !$r.ok -or !$r.alpha) { throw 'Installed Alpha failed' }
            if ($attempt -eq 2 -and !$r.saveVerified) { throw 'Save persistence failed' }
          }
      - name: Linux graphics dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2t64 libgtk-3-0t64 libnss3 libgbm1 xvfb
      - name: Verify native Mac and Linux apps twice
        if: matrix.platform != 'win'
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'mac' ]; then
            export SPARE_ROOM_TEST_ANGLE=swiftshader
            APP='platform-build/mac-universal/The Spare Room.app/Contents/MacOS/The Spare Room'
            codesign --verify --deep --strict 'platform-build/mac-universal/The Spare Room.app'
            lipo -info "$APP"
          else
            chmod +x platform-build/*.AppImage
            platform-build/*.AppImage --appimage-extract >/dev/null
            APP='./squashfs-root/the-spare-room'
          fi
          export SPARE_ROOM_SMOKE_PROFILE="$RUNNER_TEMP/spare-alpha-profile"
          for attempt in 1 2; do
            export SPARE_ROOM_SMOKE_REPORT="$RUNNER_TEMP/alpha-smoke-$attempt.json"
            EXTRA=''
            if [ "$attempt" = 2 ]; then EXTRA='--smoke-verify-save'; fi
            if [ '${{ matrix.platform }}' = 'linux' ]; then
              xvfb-run -a "$APP" --no-sandbox --smoke-test $EXTRA
            else
              "$APP" --smoke-test $EXTRA
            fi
            node -e "const r=require(process.env.SPARE_ROOM_SMOKE_REPORT);if(!r.ok||!r.alpha)process.exit(1)"
          done
      - name: Package browser and matching source
        if: matrix.platform == 'linux'
        run: |
          node scripts/prepare-pwa.cjs dist pwa-build release.json
          python3 scripts/package-release.py
          mkdir -p installer-output
          python3 scripts/package-desktop-source.py
          python3 -c "import shutil;shutil.make_archive('The-Spare-Room-v3.0.0-installable-web','zip','pwa-build')"
          cp release-build/*.zip installer-output/*.zip The-Spare-Room-v3.0.0-installable-web.zip platform-build/
      - name: Collect verified assets
        shell: bash
        run: |
          mkdir -p alpha-output
          find platform-build -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -exec cp {} alpha-output/ \;
          cp installer-build.json 'alpha-output/${{ matrix.platform }}-BUILD.json'
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-v3-${{ matrix.platform }}
          path: alpha-output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/alpha-smoke-*.json
          if-no-files-found: ignore
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha-v3-*
          path: alpha-results
      - name: Publish verified Alpha; make v2.7.6 latest stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-alpha.cjs
