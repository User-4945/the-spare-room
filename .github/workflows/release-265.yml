name: Build and publish Halloween v2.6.5
on:
  push:
    branches: [release-v2.6.5]
permissions:
  contents: write
concurrency:
  group: spare-room-release-265
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
          - platform: mac
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node tests/halloween.cjs
      - run: node tests/release-event.cjs
      - run: node tests/week2.cjs
      - name: Record exact game and installer source
        run: node scripts/record-265-build.cjs '${{ matrix.platform }}'
      - name: Build native installer
        run: |
          node scripts/prepare-desktop.cjs
          npx electron-builder --config platforms/electron-builder.cjs --${{ matrix.platform }} --publish never
      - name: Check installed Windows app and saved settings
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem platform-build/*Setup*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'spare-265-installed'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          $exe = Join-Path $installDir 'The Spare Room.exe'
          $env:SPARE_ROOM_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'spare-265-profile'
          foreach ($attempt in 1,2) {
            $env:SPARE_ROOM_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP "smoke-$attempt.json"
            $argsList = @('--smoke-test')
            if ($attempt -eq 2) { $argsList += '--smoke-verify-save' }
            $p = Start-Process $exe -ArgumentList $argsList -PassThru
            if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Launch timed out' }
            $r = Get-Content $env:SPARE_ROOM_SMOKE_REPORT -Raw | ConvertFrom-Json
            if ($p.ExitCode -ne 0 -or !$r.ok -or !$r.settingsPreferences) { throw 'Installed game check failed' }
            if ($attempt -eq 2 -and !$r.saveVerified) { throw 'Save missing' }
          }
      - name: Install Linux graphics dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2t64 libgtk-3-0t64 libnss3 libgbm1 xvfb
      - name: Verify native Mac and Linux apps twice
        if: matrix.platform != 'win'
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'mac' ]; then
            export SPARE_ROOM_TEST_ANGLE=default
            APP='platform-build/mac-universal/The Spare Room.app/Contents/MacOS/The Spare Room'
            codesign --verify --deep --strict 'platform-build/mac-universal/The Spare Room.app'
            lipo -info "$APP"
          else
            chmod +x platform-build/*.AppImage
            platform-build/*.AppImage --appimage-extract >/dev/null
            APP='./squashfs-root/the-spare-room'
          fi
          export SPARE_ROOM_SMOKE_PROFILE="$RUNNER_TEMP/spare-265-profile"
          for attempt in 1 2; do
            export SPARE_ROOM_SMOKE_REPORT="$RUNNER_TEMP/smoke-$attempt.json"
            EXTRA=''
            if [ "$attempt" = 2 ]; then EXTRA='--smoke-verify-save'; fi
            if [ '${{ matrix.platform }}' = 'linux' ]; then
              xvfb-run -a "$APP" --no-sandbox --smoke-test $EXTRA
            else
              "$APP" --smoke-test $EXTRA
            fi
            node -e "const r=require(process.env.SPARE_ROOM_SMOKE_REPORT);if(!r.ok||!r.settingsPreferences)process.exit(1)"
          done
      - name: Package browser and source downloads
        if: matrix.platform == 'linux'
        run: |
          node scripts/prepare-halloween.cjs
          node scripts/prepare-pwa.cjs dist pwa-build release.json
          node --test tests/pwa.cjs
          xvfb-run -a npx electron --no-sandbox scripts/smoke-halloween.cjs
          xvfb-run -a npx electron --no-sandbox scripts/smoke-pwa.cjs
          xvfb-run -a npx electron --no-sandbox scripts/smoke-week2.cjs
          python3 scripts/package-release.py
          mkdir -p installer-output
          python3 scripts/package-desktop-source.py
          python3 -c "import shutil;shutil.make_archive('The-Spare-Room-v2.6.5-installable-web','zip','pwa-build')"
          cp release-build/*.zip installer-output/*.zip The-Spare-Room-v2.6.5-installable-web.zip platform-build/
          cp RELEASE_NOTES.md platform-build/
      - name: Collect verified downloads
        shell: bash
        run: |
          mkdir -p release-output
          find platform-build -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name 'RELEASE_NOTES.md' \) -exec cp {} release-output/ \;
          cp installer-build.json 'release-output/${{ matrix.platform }}-BUILD.json'
      - uses: actions/upload-artifact@v4
        with:
          name: halloween-265-${{ matrix.platform }}
          path: release-output/
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux' && always()
        with:
          name: halloween-265-screenshots
          path: halloween-checks/
          if-no-files-found: ignore
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: halloween-265-*
          path: release-artifacts
      - name: Publish verified prerelease without changing stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-265.cjs
