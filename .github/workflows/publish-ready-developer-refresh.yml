name: Publish verified desktop refresh downloads
on:
  push:
    branches: [developer-refresh-ready]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify completed Windows and Linux jobs
        run: |
          gh api repos/${{ github.repository }}/actions/runs/41897144092 > /tmp/source-run.json
          gh api 'repos/${{ github.repository }}/actions/runs/41897144092/jobs?per_page=100' > /tmp/source-jobs.json
          node - <<'JS'
          const r=require('/tmp/source-run.json'),jobs=require('/tmp/source-jobs.json').jobs.filter(j=>/build .*?, (win|linux),/.test(j.name));
          if(r.head_sha!=='49e22e5b1653c2a7b68fbbff45cfc2525d4e5a70'||jobs.length!==17||jobs.some(j=>j.conclusion!=='success'))throw Error('Native build verification incomplete');
          JS
      - name: Download completed verified artifacts
        run: gh run download 41897144092 --pattern 'developer-refresh-*' --dir refresh-results
      - name: Publish verified downloads
        run: |
          for folder in refresh-results/developer-refresh-*; do
            rm -rf platform-build
            mkdir platform-build
            cp "$folder"/* platform-build/
            cp "$folder/installer-build.json" installer-build.json
            version=$(node -p 'require("./installer-build.json").game_version')
            platform=$(node -p 'require("./installer-build.json").platform')
            if [ "$version" = "3.0.0" ]; then cp developer-game/RELEASE_NOTES_DRAFT.md RELEASE_NOTES.md; fi
            GITHUB_SHA=49e22e5b1653c2a7b68fbbff45cfc2525d4e5a70 node scripts/publish-developer-refresh.cjs "$version" "$platform"
          done
      - name: Finalize developer channel notes and checksums
        run: node scripts/finalize-developer-refresh.cjs
