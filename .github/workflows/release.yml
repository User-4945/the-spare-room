name: Publish game and refreshed installers
on:
  push:
    branches: [main]
    paths: [release.json, dist/**, RELEASE_NOTES.md]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spare-room-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.publish.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check current game and updater
        run: |
          for script in dist/*.js desktop/*.cjs desktop/*.js scripts/*.cjs; do node --check "$script"; done
          npm test
      - name: Package browser build
        run: python3 scripts/package-release.py
      - name: Rename prerelease and prepare installer inventory
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.cjs
  installers:
    needs: release
    uses: ./.github/workflows/windows-desktop.yml
    with:
      matrix: ${{ needs.release.outputs.matrix }}
    secrets: inherit
