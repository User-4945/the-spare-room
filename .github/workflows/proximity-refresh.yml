name: Fix nearby interactions and memory-house doorframes
on:
  push:
    branches: [proximity-refresh]
permissions:
  contents: write
  actions: read
concurrency:
  group: spare-room-proximity-refresh
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2.7.5"
            platform: win
            runner: windows-latest
          - version: "2.7.5"
            platform: mac
            runner: macos-latest
          - version: "2.7.5"
            platform: linux
            runner: ubuntu-latest
          - version: "2.6.5"
            platform: win
            runner: windows-latest
          - version: "2.6.5"
            platform: mac
            runner: macos-latest
          - version: "2.6.5"
            platform: linux
            runner: ubuntu-latest
          - version: "2.5.0"
            platform: win
            runner: windows-latest
          - version: "2.5.0"
            platform: mac
            runner: macos-latest
          - version: "2.5.0"
            platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve shipped game and add revision-aware updater
        run: node scripts/prepare-proximity-release.cjs '${{ matrix.version }}' '${{ matrix.platform }}'
      - run: npm test
      - run: node --test tests/admin-auth.cjs tests/admin-network.cjs
      - run: node tests/admin-compat.cjs
      - run: node tests/admin-events.cjs
      - run: node tests/prompt-compat.cjs
      - run: node tests/hold-interactions.cjs
      - name: Verify Week 3 invitation and renderer
        if: matrix.version == '2.7.5'
        run: |
          node tests/week3.cjs
          node tests/rendering.cjs
      - name: Build native installer
        run: |
          node scripts/prepare-desktop.cjs
          npx electron-builder --config platforms/electron-builder.cjs --${{ matrix.platform }} --publish never
      - name: Verify installed Windows app and save persistence
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem platform-build/*Setup*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'spare-admin-installed'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          $exe = Join-Path $installDir 'The Spare Room.exe'
          $env:SPARE_ROOM_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'spare-admin-profile'
          foreach ($attempt in 1,2) {
            $env:SPARE_ROOM_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP "smoke-$attempt.json"
            $argsList = @('--smoke-test')
            if ($attempt -eq 2) { $argsList += '--smoke-verify-save' }
            $p = Start-Process $exe -ArgumentList $argsList -PassThru
            if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Launch timed out' }
            $r = Get-Content $env:SPARE_ROOM_SMOKE_REPORT -Raw | ConvertFrom-Json
            if ($p.ExitCode -ne 0 -or !$r.ok -or !$r.settingsPreferences -or !$r.adminNetworkVerified -or !$r.promptControls -or !$r.adminEventsFlight) { throw 'Installed app check failed' }
            if ($attempt -eq 2 -and !$r.saveVerified) { throw 'Save missing' }
          }
      - name: Install Linux graphics dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2t64 libgtk-3-0t64 libnss3 libgbm1 xvfb
      - name: Verify Mac and Linux packages twice
        if: matrix.platform != 'win'
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'mac' ]; then
            export SPARE_ROOM_TEST_ANGLE=default
            APP='platform-build/mac-universal/The Spare Room.app/Contents/MacOS/The Spare Room'
            codesign --verify --deep --strict 'platform-build/mac-universal/The Spare Room.app'
            lipo -info "$APP"
          else
            chmod +x platform-build/*.AppImage
            platform-build/*.AppImage --appimage-extract >/dev/null
            APP='./squashfs-root/the-spare-room'
          fi
          export SPARE_ROOM_SMOKE_PROFILE="$RUNNER_TEMP/spare-admin-profile"
          for attempt in 1 2; do
            export SPARE_ROOM_SMOKE_REPORT="$RUNNER_TEMP/smoke-$attempt.json"
            EXTRA=''
            if [ "$attempt" = 2 ]; then EXTRA='--smoke-verify-save'; fi
            if [ '${{ matrix.platform }}' = 'linux' ]; then
              xvfb-run -a "$APP" --no-sandbox --smoke-test $EXTRA
            else
              "$APP" --smoke-test $EXTRA
            fi
            node -e "const r=require(process.env.SPARE_ROOM_SMOKE_REPORT);if(!r.ok||!r.settingsPreferences||!r.adminNetworkVerified||!r.promptControls||!r.adminEventsFlight)process.exit(1)"
          done
      - name: Verify actual prompts, E, click and touch in WebGL
        if: matrix.platform == 'linux'
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke-prompts.cjs
      - name: Verify Week 3 event graphics
        if: matrix.platform == 'linux' && matrix.version == '2.7.5'
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke-event-art.cjs
      - name: Package matching browser and source downloads
        if: matrix.platform == 'linux'
        run: |
          node scripts/prepare-pwa.cjs dist pwa-build release.json
          node --test tests/pwa.cjs
          xvfb-run -a npx electron --no-sandbox scripts/smoke-pwa.cjs
          python3 scripts/package-release.py
          mkdir -p installer-output
          python3 scripts/package-desktop-source.py
          python3 -c "import shutil;shutil.make_archive('The-Spare-Room-v${{ matrix.version }}-installable-web','zip','pwa-build')"
          cp release-build/*.zip installer-output/*.zip The-Spare-Room-v${{ matrix.version }}-installable-web.zip platform-build/
          cp RELEASE_NOTES.md platform-build/
          if [ '${{ matrix.version }}' != '2.5.0' ] && [ '${{ matrix.version }}' != '2.6.5' ] && [ '${{ matrix.version }}' != '2.7.5' ]; then
            cp DESKTOP_README.md platform-build/
            cp platforms/INSTALL.md platform-build/INSTALL-PLATFORMS.md
            cp installer-build.json platform-build/INSTALLER_BUILD.json
          fi
      - name: Collect verified release downloads
        shell: bash
        run: |
          mkdir -p release-output
          find platform-build -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name '*.md' -o -name 'INSTALLER_BUILD.json' \) -exec cp {} release-output/ \;
          cp installer-build.json 'release-output/${{ matrix.platform }}-BUILD.json'
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ matrix.version }}-${{ matrix.platform }}
          path: release-output/
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux' && always()
        with:
          name: graphics-${{ matrix.version }}
          path: prompt-checks/
          if-no-files-found: ignore
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: refresh-*
          path: refresh-artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-proximity-releases.cjs
