name: Refresh Christmas prerelease information
on:
  push:
    branches: [release-christmas-metadata]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update prerelease notes without promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v.3.5.0 --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes-file events/christmas/PRERELEASE_NOTES.md
